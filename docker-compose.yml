services:
  teleprint:
    image: amidexe/teleprint:latest
    restart: unless-stopped
    # host — обязателен для mDNS и прямого доступа к принтеру в локальной сети
    network_mode: host
    env_file: .env
    environment:
      DATA_DIR: /app/data
      # Раскомментируйте для поддержки офисных документов (docx, xlsx, pptx и др.)
      # GOTENBERG_URL: http://localhost:3000
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp:size=256m

  # --- Опционально: конвертация офисных документов ---
  # Раскомментируйте для поддержки DOCX, XLSX, PPTX, ODT и др.
  # gotenberg:
